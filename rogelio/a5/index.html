<DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tip Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="calc.js"></script>
<h1>Tip Calculator</h1>
<form id="form" onsubmit="return false;">
	<label>Subtotal (without GST)</label><br>
	<input type="number" id="subtotal"><br><br>
	<!--add GST 5%-->
	<label>How good was the service?</label><br>
	<select id="service">
		<option value="">-Select-</option>
		<option value="0">McDonalds</option>
		<option value="10">Average</option>
		<option value="15">Good</option>
		<option value="20">Very good</option>
	</select><br><br>
	<label>How many people do you have?</label><br>
	<select id="people">
		<option value="">-Select-</option>
		<option value="1">1 person</option>
		<option value="2">2 people</option>
		<option value="3">3 people</option>
		<option value="4">4 people</option>
		<option value="5">5 people</option>
		<option value="6">6 people</option>
		<option value="0">Dine and dash!</option>
	</select><br>
	<br>
	<button type="button" onclick="clickedSubmit()">Calculate</button>
	<input type="reset" onclick="closeReceipt()">
<p id="receiptSub"></p>
<p id="receiptGstP"></p>
<p id="receiptGst"></p>
<p id="receiptBefore"></p>
<p id="receiptTipP"></p>
<p id="receiptTip"></p>
<p id="receiptGrand"></p>
<p id="receiptSplit"></p>
</form>
</body>
</html>
