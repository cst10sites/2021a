<div class=main>
<h1>Ingredients for pesto</h1>
<p><ul>
	<li>1/3 cup pinenuts</li>
	<li>2 cups fresh basil</li>	
	<li>1/4 cup grated parmesean</li>
	<li>1 tablespoon lemon juice</li>
	<li>two cloves chopped garlic</li>
	<li>1/2 teaspoon salt</li>
	<li>1/2 cup olive oil</li>
</ul></p>
<h1>Directions</h1>
<p>
<ul>
	<li>Blend all ingrediants in blender until smooth</li>
</ul>
</p>
</div>

</body>
