 <script type="text/javascript">
    function onClick() {
	    // generate a number between 1 and 3
		// first, generate random number between 0 and 1, multiply by 10, and you get a number between 0 and 9
		// then we divide by 3 to get a number between 0 and 3, then we use ceil function to get the next integer
		// number
		var pa = Math.ceil( (Math.random() * 10)  / 3);
		
		if (pa == 1) {
			document.getElementById("receipes").src = "TomatoSauceRecipe.html";
		} else if (pa == 2) {
			document.getElementById("receipes").src = "recipe2.html";		
		} else {
			document.getElementById("receipes").src = "recipe3.html";
		}		
	}
